name: lf_training_evaluation
description: Flutter tablet app for judges — Training Evaluation system.
publish_to: "none"
version: 2.7.3+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  provider: ^6.1.2
  go_router: ^14.2.7
  intl: ^0.20.2
  path: ^1.9.0
  crypto: ^3.0.7
  flutter_pdfview: ^1.4.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/uae_mod.png
