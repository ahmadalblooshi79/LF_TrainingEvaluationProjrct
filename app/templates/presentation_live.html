<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>شاشة العرض المباشر — Live Presentation</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0b2421; overflow:hidden; }
    #frame { border:0; width:100%; height:100%; background:#fff; display:none; }
    #banner {
      position:fixed; top:0; left:0; right:0; z-index:20;
      background:rgba(11,36,33,.92); color:#f5f2e8; font:700 13px Tahoma,Arial,sans-serif;
      padding:8px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between;
    }
    #banner .ok { color:#8dffb0; }
    #banner .warn { color:#ffd27a; }
    #banner button {
      background:#c9a227; color:#0b2421; border:0; font-weight:700;
      padding:6px 12px; cursor:pointer; border-radius:4px;
    }
    body.fullscreen #banner { display:none; }
    #frame-wrap { position:absolute; inset:0; top:40px; }
    body.fullscreen #frame-wrap { top:0; }
    #idle {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg, #0b2421 0%, #143d38 55%, #0b2421 100%);
      color:#f5f2e8; text-align:center; padding:32px 20px;
      font-family:Tahoma,Arial,sans-serif;
    }
    #idle.hidden { display:none; }
    #idle h1 { margin:0 0 12px; font-size:1.6rem; font-weight:800; color:#c9a227; }
    #idle p { margin:0 auto 10px; max-width:520px; line-height:1.7; color:#d9e6e2; font-size:1rem; }
    #idle .hint {
      margin-top:18px; padding:12px 16px; border:1px solid rgba(201,162,39,.45);
      border-radius:8px; background:rgba(0,0,0,.18); font-size:.92rem; color:#ffd27a;
      max-width:560px;
    }
    #idle code {
      direction:ltr; display:inline-block; margin-top:6px; color:#8dffb0;
      font-size:.85rem; word-break:break-all;
    }
    body.has-content #frame { display:block; }
    body.has-content #idle { display:none; }
  </style>
</head>
<body>
  <div id="banner">
    <div>
      <span>شاشة العرض المباشر</span>
      ·
      <span id="status" class="warn">بانتظار جهاز التحكم…</span>
      ·
      <span id="path-label"></span>
    </div>
    <div>
      <button type="button" id="btn-fs">ملء الشاشة</button>
    </div>
  </div>
  <div id="frame-wrap">
    <div id="idle">
      <div>
        <h1>قناة العرض جاهزة</h1>
        <p>الشاشة بانتظار بدء التحكم المباشر من تابلت النظام.</p>
        <p>بعد تفعيل التحكم ستظهر هنا نفس الصفحة التي يفتحها جهاز التحكم.</p>
        <div class="hint">
          تأكد أن هذا المتصفح مسجّل دخوله في النظام، ثم من التابلت اضغط «بدء التحكم المباشر».
          <br>
          <code id="idle-url"></code>
        </div>
      </div>
    </div>
    <iframe id="frame" title="Presentation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"></iframe>
  </div>
  <script>
(function () {
  var DISPLAY_ID = {{ display_id|tojson }};
  var WS_PORT = {{ ws_port_hint|tojson }};
  var frame = document.getElementById("frame");
  var statusEl = document.getElementById("status");
  var pathEl = document.getElementById("path-label");
  var idleUrl = document.getElementById("idle-url");
  var currentPath = "";
  var connected = false;

  if (idleUrl) {
    idleUrl.textContent = location.origin + "/presentation/live?display_id=" + DISPLAY_ID;
  }

  function setStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = ok ? "ok" : "warn";
  }

  function showContent(on) {
    document.body.classList.toggle("has-content", !!on);
  }

  /** تمرير فقط — بدون أي transform/scale (كان يسبب تكبيراً عشوائياً). */
  function applyScrollOnly(payload) {
    payload = payload || {};
    var x = Number(payload.x != null ? payload.x : payload.scrollX);
    var y = Number(payload.y != null ? payload.y : payload.scrollY);
    if (!isFinite(x)) x = 0;
    if (!isFinite(y)) y = 0;
    try {
      if (frame.contentWindow) {
        frame.contentWindow.scrollTo(x, y);
      }
    } catch (e) {}
  }

  function clearAnyScale() {
    try {
      var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
      if (!doc) return;
      var html = doc.documentElement;
      var body = doc.body;
      if (html) {
        html.style.transform = "";
        html.style.zoom = "";
      }
      if (body) {
        body.style.transform = "";
        body.style.zoom = "";
      }
    } catch (e) {}
  }

  function navigate(path, force) {
    if (!path) return;
    if (!force && path === currentPath) return;
    currentPath = path;
    pathEl.textContent = path;
    var url = path;
    if (path.indexOf("http") !== 0) {
      url = path.charAt(0) === "/" ? path : "/" + path;
    }
    showContent(true);
    frame.src = url;
  }

  function markConnected(label) {
    connected = true;
    setStatus("متصل — " + (label || "جهاز تحكم"), true);
  }

  function handleEvent(evt) {
    if (!evt || !evt.type) return;
    if (evt.type === "session_started") {
      markConnected(evt.username || evt.device_label || "جهاز تحكم");
      if (evt.path) navigate(evt.path);
      else refreshStatus(true);
      return;
    }
    if (evt.type === "session_ended") {
      connected = false;
      currentPath = "";
      showContent(false);
      pathEl.textContent = "";
      try { frame.removeAttribute("src"); } catch (e) {}
      setStatus("انتهت جلسة التحكم — بانتظار جهاز جديد", false);
      return;
    }
    if (evt.type === "session_lock") {
      setStatus(evt.locked ? "الجلسة مقفلة" : "الجلسة مفتوحة", true);
      return;
    }
    if (evt.type === "navigate" || evt.type === "open" || evt.type === "tab") {
      markConnected(evt.username || "");
      navigate(evt.path || (evt.payload && evt.payload.path));
      return;
    }
    /* تجاهل أوامر التكبير بالكامل — لا scale ولا إحداثيات تكبير خاطئة */
    if (evt.type === "zoom" || evt.type === "pan") {
      clearAnyScale();
      return;
    }
    if (evt.type === "scroll") {
      clearAnyScale();
      applyScrollOnly(evt.payload || {});
      return;
    }
    if (evt.type === "click" && evt.payload && evt.payload.selector) {
      try {
        var el = frame.contentDocument.querySelector(evt.payload.selector);
        if (el) el.click();
      } catch (e) {}
    }
  }

  function refreshStatus(forceNavigate) {
    fetch("/api/remote-control/status?display_id=" + encodeURIComponent(DISPLAY_ID), {
      credentials: "same-origin",
      cache: "no-store"
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.active) {
          markConnected(d.active.username || "");
          var path = d.active.last_path || "/dashboard";
          if (forceNavigate || !currentPath) navigate(path);
        } else if (!connected) {
          setStatus("قناة العرض جاهزة — بانتظار التحكم", false);
        }
        if (d.last_state && (d.last_state.type === "navigate" || d.last_state.type === "open" || d.last_state.type === "tab")) {
          handleEvent(d.last_state);
        }
      })
      .catch(function () {});
  }

  function connectSse() {
    var es = new EventSource("/api/remote-control/stream?display_id=" + encodeURIComponent(DISPLAY_ID));
    es.addEventListener("remote", function (e) {
      try { handleEvent(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener("hello", function () {
      if (!connected) setStatus("قناة العرض جاهزة — بانتظار التحكم", false);
      refreshStatus(false);
    });
    es.onerror = function () {
      if (!connected) setStatus("إعادة الاتصال بقناة العرض…", false);
    };
  }

  function connectWs() {
    try {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      var host = location.hostname;
      var url = proto + "//" + host + ":" + WS_PORT + "/?display_id=" + encodeURIComponent(DISPLAY_ID);
      var ws = new WebSocket(url);
      ws.onmessage = function (e) {
        try { handleEvent(JSON.parse(e.data)); } catch (err) {}
      };
    } catch (e) {}
  }

  document.getElementById("btn-fs").addEventListener("click", function () {
    var el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      document.body.classList.add("fullscreen");
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      document.body.classList.remove("fullscreen");
    }
  });

  frame.addEventListener("load", function () {
    clearAnyScale();
  });

  refreshStatus(true);
  connectSse();
  connectWs();
  setInterval(function () { refreshStatus(false); }, 8000);
})();
  </script>
</body>
</html>
